<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Bingo Sheet Generator</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bingo-header-font {
            font-family: 'Fredoka', sans-serif;
        }
        
        /* Rigid 5x5 Grid aspect enforcement & fluid viewport scaling */
        .landscape-sheet {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* Responsive 5x5 Grid that strictly scales with card dimensions */
        #bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-template-rows: repeat(5, minmax(0, 1fr));
            width: 100%;
            gap: 0.375rem;
        }

        /* Each cell is a container query parent */
        .square-cell {
            aspect-ratio: 1 / 1;
            container-type: inline-size;
            min-height: 0;
            min-width: 0;
            width: 100%;
            height: 100%;
        }

        /* Dynamic font scaling based strictly on the cell container width (cqw) */
        .bingo-cell {
            font-size: clamp(0.45rem, 11cqw, 0.95rem);
            line-height: 1.15;
            word-break: break-word;
            hyphens: auto;
            -webkit-hyphens: auto;
            overflow: hidden !important;
        }

        /* Custom styled green checkmark overlay for selected cells in Play Mode */
        .cell-checked {
            border: 4px solid #16a34a !important; /* Thick green border */
            background-color: #f0fdf4 !important; /* Soft green tint */
            position: relative;
        }
        .cell-checked::after {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 2px;
            right: 4px;
            color: #16a34a;
            font-size: 0.9rem;
            line-height: 1;
            pointer-events: none;
            filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.15));
        }
        @media (min-width: 640px) {
            .cell-checked::after {
                top: 4px;
                right: 6px;
                font-size: 1.2rem;
            }
        }

        /* Strictly shrink card and cells to fit screen height in landscape viewports */
        @media (min-width: 1024px) and (min-aspect-ratio: 1/1) {
            body {
                overflow-y: hidden;
            }
            .landscape-fit-container {
                height: calc(100vh - 4.5rem);
                max-height: calc(100vh - 4.5rem);
            }
            .landscape-sheet {
                max-height: calc(100vh - 5.5rem);
                width: auto;
                aspect-ratio: 1 / 1.12; /* Keep card proportions locked */
                margin: 0 auto;
            }
            #bingo-grid {
                flex: 1 1 auto;
                height: 100%;
            }
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Print Specific Styling */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .print-container {
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .bingo-card {
                border: 3px solid #000 !important;
                page-break-inside: avoid;
            }
            .bingo-cell {
                border: 2px solid #000 !important;
                background-color: #fff !important;
                color: #000 !important;
            }
            .bingo-header-letter {
                color: #000 !important;
                text-shadow: none !important;
            }
            .free-space {
                background-color: #f3f4f6 !important;
            }
        }
    </style>

<body class="bg-slate-100 min-h-screen text-slate-800 pb-6">

    <!-- Top Navigation Bar -->
    <header class="bg-indigo-600 text-white shadow-md no-print mb-4">
        <div class="w-full max-w-[98vw] mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-table-cells text-2xl text-amber-300"></i>
                <h1 class="text-xl font-bold tracking-wide">Bingo Sheet Generator</h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="window.print()" class="bg-amber-400 hover:bg-amber-300 text-indigo-950 font-semibold px-4 py-2 rounded-lg shadow transition duration-150 flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> Print Sheet
                </button>
            </div>
        </div>
    </header>

    <main class="w-full max-w-[98vw] mx-auto px-2 sm:px-4 grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 landscape-fit-container">
        
        <!-- Left Column: Controls & Actions (no-print) - Compact 3 columns on large screens -->
        <section class="lg:col-span-3 space-y-4 no-print overflow-y-auto max-h-full">
            
            <!-- Controls Panel -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
                <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-indigo-600"></i> Controls &amp; Mode Switch
                </h2>
                
                <!-- Mode Switcher (Edit Mode vs Play Mode) -->
                <div class="mb-4 p-3 bg-indigo-50/80 rounded-xl border border-indigo-100 flex items-center justify-between">
                    <div>
                        <span class="block text-xs sm:text-sm font-bold text-indigo-950 flex items-center gap-1.5">
                            <i id="mode-icon" class="fa-solid fa-pen-to-square text-indigo-600"></i> 
                            <span id="mode-label-text">Edit Mode</span>
                        </span>
                        <span id="mode-desc-text" class="text-[11px] text-indigo-700/80">Click cells to edit</span>
                    </div>

                    <!-- Custom Mode Toggle Switch -->
                    <button id="mode-toggle-btn" onclick="toggleMode()" class="px-3 py-1.5 rounded-lg font-semibold text-xs transition duration-200 flex items-center gap-1.5 bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm"><i class="fa-solid fa-play"></i> Switch to Play</button>
                </div>

                <!-- FREE Space Toggle -->
                <div class="mb-4 flex items-center justify-between p-2.5 bg-slate-50 rounded-lg border border-slate-200">
                    <div>
                        <span class="block text-xs sm:text-sm font-semibold text-slate-700">Center Free Space</span>
                        <span class="text-[11px] text-slate-500">Lock center cell as FREE</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-free-space" checked="" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                    </label>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-shuffle" onclick="shuffleGrid()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-2.5 rounded-lg border border-slate-300 transition duration-150 flex items-center justify-center gap-1.5 text-xs sm:text-sm">
                        <i class="fa-solid fa-shuffle text-indigo-600"></i> Shuffle
                    </button>
                    <button id="btn-clear" onclick="clearGrid()" class="w-full bg-slate-100 hover:bg-rose-50 text-rose-600 font-semibold py-2 px-2.5 rounded-lg border border-slate-300 hover:border-rose-200 transition duration-150 flex items-center justify-center gap-1.5 text-xs sm:text-sm">
                        <i class="fa-solid fa-trash-can"></i> Clear
                    </button>
                </div>
            </div>

            <!-- Custom Bulk Item Import -->
            <div id="bulk-import-card" class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
                <h2 class="text-base font-bold text-slate-800 mb-1 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i> Bulk Item Loader
                </h2>
                <p class="text-[11px] text-slate-500 mb-2">Paste list of items (commas or newlines):</p>

                <textarea id="bulk-input" rows="3" placeholder="Item 1
Item 2
Item 3..." class="w-full p-2.5 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none mb-2 font-mono"></textarea>
                
                <button onclick="applyBulkText()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-3 rounded-lg text-xs sm:text-sm shadow transition">
                    Fill Grid From List
                </button>
            </div>

        </section>

        <!-- Right Column: Printable Bingo Sheet (Expanded 9 columns on large screens) -->
        <section class="lg:col-span-9 flex justify-center items-center w-full h-full overflow-hidden">
            <div class="print-container landscape-sheet bg-white rounded-2xl shadow-xl border border-slate-200 p-2.5 sm:p-4 w-full max-w-4xl flex flex-col justify-between">
                <!-- Bingo Header Letters -->
                <div class="bingo-card bg-slate-900 rounded-xl p-1.5 sm:p-2 shadow-md mb-2 border-2 border-slate-800 shrink-0">
                    <div class="grid grid-cols-5 gap-2 text-center bingo-header-font text-white text-lg sm:text-2xl font-black tracking-wider">
                        <div class="bingo-header-letter text-rose-600">B</div>
                        <div class="bingo-header-letter text-amber-400">I</div>
                        <div class="bingo-header-letter text-emerald-400">N</div>
                        <div class="bingo-header-letter text-indigo-400">G</div>
                        <div class="bingo-header-letter text-rose-600">O</div>
                    </div>
                </div>

                <!-- Interactive 5x5 Bingo Grid Container -->
                <div id="bingo-grid"></div>
            </div>
        </section>

    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 border border-slate-700 transition-opacity duration-300 opacity-0 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message" class="text-sm font-medium">Edit Mode active. Selections reset.</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // App State
        let isPlayMode = false;
        const STORAGE_KEY = 'bingo_sheet_grid_items';

        // Compression & Decompression Functions
        async function compressToGzipBase64(text) {
            const bytes = new TextEncoder().encode(text);
            const cs = new CompressionStream('gzip');
            const writer = cs.writable.getWriter();
            writer.write(bytes);
            writer.close();
            const blob = await new Response(cs.readable).blob();
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function decompressFromGzipBase64(base64String) {
            const binaryString = atob(base64String);
            const bytes = Uint8Array.from(binaryString, char => char.charCodeAt(0));
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            writer.write(bytes);
            writer.close();
            const buffer = await new Response(ds.readable).arrayBuffer();
            return new TextDecoder().decode(buffer);
        }

        /**
         * Updates the URL hash with compressed grid text state
         */
        async function updateUrlHash(items) {
            try {
                const joinedText = items.join('\u2399');
                const compressedB64 = await compressToGzipBase64(joinedText);
                history.replaceState(null, '', '#' + compressedB64);
            } catch (e) {
                console.warn('Unable to update URL hash:', e);
            }
        }

        /**
         * Parses items from the URL hash if available
         */
        async function loadGridFromUrlHash() {
            const hash = window.location.hash.substring(1).trim();
            if (!hash) return null;
            try {
                const decompressedText = await decompressFromGzipBase64(hash);
                return decompressedText.split('\u2399');
            } catch (e) {
                console.warn('Failed to decompress state from URL hash:', e);
                return null;
            }
        }

        /**
         * Triggered whenever any cell content is edited in Edit Mode.
         * Fetches the updated grid array, joins the cells using \u2399, updates LocalStorage, and updates URL hash.
         * @param {Event} event - The input event
         * @param {HTMLElement} cell - The cell element being edited
         */
        async function onCellEdit(event, cell) {
            const currentGrid = getBingoTextArray();
            saveGridToLocalStorage(currentGrid);
            await updateUrlHash(currentGrid);
            const joinedText = currentGrid.join('\u2399');
            console.log('Joined Grid Text:', joinedText);
        }

        /**
         * Saves current 1D grid items array to localStorage.
         * @param {Array<string>} items
         */
        function saveGridToLocalStorage(items) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            } catch (e) {
                console.warn('Unable to save to localStorage:', e);
            }
        }

        /**
         * Loads grid items from localStorage if available.
         * @returns {Array<string>|null}
         */
        function loadGridFromLocalStorage() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                return stored ? JSON.parse(stored) : null;
            } catch (e) {
                console.warn('Unable to read from localStorage:', e);
                return null;
            }
        }

        // Default Initial Grid Data
        const DEFAULT_ITEMS = [
            "Muted while speaking", "Awkward silence", "Can you see my screen?", "Child/pet appearance", "Sorry I double muted",
            "Loud typing sounds", "Synergy", "Let's take this offline", "Ping me later", "Two people speak at once",
            "Coffee break", "Out of pocket", "FREE", "Echo on line", "Next slide please",
            "Action items", "Hard stop at top of hour", "Deep dive", "Quick question", "Brainstorming",
            "Heavy breathing on mic", "Is [Name] on the call?", "Bandwidth issue", "Touch base", "Circle back"
        ];

        /**
         * Initializes the 5x5 Grid UI from state, URL hash, or localStorage
         */
        function initGrid(items = null) {
            const gridContainer = document.getElementById('bingo-grid');
            if (!gridContainer) return;

            gridContainer.innerHTML = '';
            
            const sourceItems = items || DEFAULT_ITEMS;
            const freeSpaceChecked = document.getElementById('toggle-free-space')?.checked ?? true;

            sourceItems.slice(0, 25).forEach((text, index) => {
                const cell = document.createElement('div');
                const isCenter = (index === 12);

                cell.dataset.index = index;
                cell.className = "bingo-cell square-cell bg-white rounded-lg p-1.5 sm:p-2 border border-slate-300 flex items-center justify-center text-center font-medium text-slate-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 hover:border-indigo-300 transition-all duration-150 cursor-pointer select-text relative";
                
                if (isCenter && freeSpaceChecked) {
                    cell.innerText = "FREE";
                    cell.contentEditable = "false";
                    cell.classList.add('free-space', 'bg-amber-100', 'text-amber-900', 'font-bold', 'border-amber-300');
                } else {
                    cell.innerText = text;
                    cell.contentEditable = !isPlayMode ? "true" : "false";
                    
                    // Attach edit listener
                    cell.addEventListener('input', (e) => onCellEdit(e, cell));
                }

                // Add toggle click for play mode
                cell.addEventListener('click', () => {
                    if (isPlayMode) {
                        cell.classList.toggle('cell-checked');
                    }
                });

                gridContainer.appendChild(cell);
            });

            const activeItems = getBingoTextArray();
            saveGridToLocalStorage(activeItems);
            updateUrlHash(activeItems);
        }

        /**
         * Toggles between Edit Mode and Play Mode
         */
        function toggleMode() {
            isPlayMode = !isPlayMode;
            const modeBtn = document.getElementById('mode-toggle-btn');
            const modeIcon = document.getElementById('mode-icon');
            const modeLabel = document.getElementById('mode-label-text');
            const modeDesc = document.getElementById('mode-desc-text');
            const bulkCard = document.getElementById('bulk-import-card');
            const shuffleBtn = document.getElementById('btn-shuffle');
            const clearBtn = document.getElementById('btn-clear');
            const freeSpaceToggle = document.getElementById('toggle-free-space');

            const cells = document.querySelectorAll('.bingo-cell');

            if (isPlayMode) {
                // Switch to Play Mode
                modeBtn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Switch to Edit';
                modeBtn.className = "px-3.5 py-2 rounded-lg font-semibold text-xs transition duration-200 flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm";
                
                modeIcon.className = "fa-solid fa-gamepad text-emerald-600";
                modeLabel.innerText = "Play Mode";
                modeDesc.innerText = "Click cells to mark/unmark with checkmark";

                // Disable editing controls in Play Mode
                bulkCard?.classList.add('opacity-50', 'pointer-events-none');
                shuffleBtn?.setAttribute('disabled', 'true');
                shuffleBtn?.classList.add('opacity-50', 'cursor-not-allowed');
                clearBtn?.setAttribute('disabled', 'true');
                clearBtn?.classList.add('opacity-50', 'cursor-not-allowed');
                if (freeSpaceToggle) freeSpaceToggle.disabled = true;

                cells.forEach(cell => {
                    cell.contentEditable = "false";
                    cell.classList.remove('select-text');
                    cell.classList.add('select-none');
                });

                showToast("Play Mode active! Click cells to check off.", "fa-circle-check", "text-emerald-400");
            } else {
                // Switch back to Edit Mode
                modeBtn.innerHTML = '<i class="fa-solid fa-play"></i> Switch to Play';
                modeBtn.className = "px-3.5 py-2 rounded-lg font-semibold text-xs transition duration-200 flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm";
                
                modeIcon.className = "fa-solid fa-pen-to-square text-indigo-600";
                modeLabel.innerText = "Edit Mode";
                modeDesc.innerText = "Click cells to edit text directly";

                // Re-enable editing controls
                bulkCard?.classList.remove('opacity-50', 'pointer-events-none');
                shuffleBtn?.removeAttribute('disabled');
                shuffleBtn?.classList.remove('opacity-50', 'cursor-not-allowed');
                clearBtn?.removeAttribute('disabled');
                clearBtn?.classList.remove('opacity-50', 'cursor-not-allowed');
                if (freeSpaceToggle) freeSpaceToggle.disabled = false;

                const freeSpaceChecked = document.getElementById('toggle-free-space')?.checked ?? true;

                cells.forEach(cell => {
                    // Unselect/reset checked state when returning to Edit Mode
                    cell.classList.remove('cell-checked', 'select-none');
                    cell.classList.add('select-text');

                    const isCenter = (cell.dataset.index === "12");
                    if (!(isCenter && freeSpaceChecked)) {
                        cell.contentEditable = "true";
                    }
                });

                showToast("Edit Mode active. Selections reset.", "fa-pen-to-square", "text-indigo-400");
            }
        }

        /**
         * Extracts current bingo cell contents into an array
         */
        function getBingoTextArray(as2DArray = false) {
            const cells = document.querySelectorAll('.bingo-cell');
            const flatArray = Array.from(cells).map(cell => cell.innerText.trim());

            if (!as2DArray) return flatArray;

            const grid2D = [];
            for (let i = 0; i < 5; i++) {
                grid2D.push(flatArray.slice(i * 5, (i + 1) * 5));
            }
            return grid2D;
        }

        /**
         * Shuffles the grid items randomly
         */
        function shuffleGrid() {
            if (isPlayMode) return;
            let currentItems = getBingoTextArray();
            
            // Fisher-Yates shuffle
            for (let i = currentItems.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentItems[i], currentItems[j]] = [currentItems[j], currentItems[i]];
            }
            initGrid(currentItems);
            showToast("Grid shuffled!", "fa-shuffle", "text-indigo-400");
        }

        /**
         * Clears all cell texts
         */
        function clearGrid() {
            if (isPlayMode) return;
            const emptyItems = Array(25).fill("");
            initGrid(emptyItems);
            showToast("Grid cleared", "fa-trash-can", "text-rose-400");
        }

        /**
         * Applies custom bulk input text from the textarea into the grid
         */
        function applyBulkText() {
            if (isPlayMode) return;
            const bulkInput = document.getElementById('bulk-input');
            if (!bulkInput) return;

            const text = bulkInput.value.trim();
            if (!text) return;

            // Split by line breaks or commas
            let items = text.split(/[\n,]+/).map(item => item.trim()).filter(item => item.length > 0);

            // Fill or pad to 25 items
            while (items.length < 25) {
                items.push("");
            }

            initGrid(items);
            showToast("Custom list applied!", "fa-circle-check", "text-emerald-400");
        }

        /**
         * Toast notification system
         */
        function showToast(message, iconClass = "fa-circle-check", iconColor = "text-emerald-400") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            if (!toast || !toastMsg || !toastIcon) return;

            toastMsg.innerText = message;
            toastIcon.className = `fa-solid ${iconClass} ${iconColor}`;

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Initialize grid on DOMContentLoaded checking URL Hash -> localStorage -> Default
        window.addEventListener('DOMContentLoaded', async () => {
            const urlItems = await loadGridFromUrlHash();
            const localItems = loadGridFromLocalStorage();
            const initialItems = urlItems || localItems || DEFAULT_ITEMS;

            initGrid(initialItems);

            document.getElementById('toggle-free-space')?.addEventListener('change', () => {
                initGrid(getBingoTextArray());
            });
        });
    </script>
